# Bun configuration for chirping-astro
# https://bun.sh/docs/runtime/bunfig

[install]
# Use exact dependency versions in lockfile, but allow ranges in package.json
exact = false
# Save peer dependencies
peer = true

[install.cache]
disable = false

[run]
# Astro must execute under Node (Bun execution stalls the Astro 6 build).
# Bun remains the package manager for install/lockfile operations.
bun = false
silent = false
