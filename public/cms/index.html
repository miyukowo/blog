<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Sveltia CMS</title>
    <!--
      T6: the CMS bundle is pinned to an exact, published version so the editing
      behavior is reproducible. 0.256.1 was verified against
      https://registry.npmjs.org/@sveltia/cms and the current Sveltia docs:
      config discovery defaults to `config.yml` next to this page, the
      `rel="cms-config-url"` link below makes the local file explicit, and
      `media_libraries.cloudinary.output_filename_only: false` stores full URLs.
      When bumping the version, update the integrity hash and the schema
      reference in config.yml together, then re-run tests/site/cms.test.mjs.
    -->
    <!--
      Preview isolation: this page always loads the config from its own
      directory (`./config.yml`), i.e. the deployed `/cms/config.yml`. It never
      reads a config from another path or origin. `scripts/prepare-preview.mjs`
      rewrites only the generated `dist/cms/config.yml` and never the tracked
      `public/cms/config.yml`.
    -->
    <link href="./config.yml" type="application/yaml" rel="cms-config-url" />
  </head>
  <body>
    <script
      src="https://unpkg.com/@sveltia/cms@0.256.1/dist/sveltia-cms.js"
      integrity="sha384-LPT86oZkLhmoF84O1jKZBSaFJOVvKv8sjXDKap1SOaSwzbC8F6HH7rTJWekmAzG9"
      crossorigin="anonymous"
    ></script>
    <script>
      /**
       * Alert / Callout editor component.
       *
       * Content uses `<Alert ...>...</Alert>` (src/components/Alert.astro), so
       * the generated block includes the matching import. Without it, inserted
       * MDX would not compile ("`Alert` is not defined"). The pattern also
       * consumes an existing import in front of the block, so editing a saved
       * post replaces that import instead of adding a duplicate one.
       */
      const ALERT_IMPORT = "import Alert from '/src/components/Alert.astro';";

      /** Escape a value so it is safe inside a double-quoted JSX attribute. */
      const escapeAttribute = (value) =>
        String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\r?\n/g, ' ');

      /** Reverse escapeAttribute so a saved block round-trips unchanged. */
      const unescapeAttribute = (value) =>
        String(value ?? '')
          .replace(/&lt;/g, '<')
          .replace(/&gt;/g, '>')
          .replace(/&quot;/g, '"')
          .replace(/&amp;/g, '&');

      /** Read one double-quoted attribute out of an MDX JSX tag. */
      const getAttribute = (attributes, name) => {
        const match = attributes.match(new RegExp(`(?:^|\\s)${name}="([^"]*)"`));
        return match ? unescapeAttribute(match[1]) : '';
      };

      CMS.registerEditorComponent({
        id: 'alert',
        label: 'Alert / Callout',
        fields: [
          {
            name: 'type',
            label: 'Type',
            widget: 'select',
            options: ['info', 'warning', 'error', 'success'],
            default: 'info',
          },
          {
            name: 'style',
            label: 'Style',
            widget: 'select',
            options: ['soft', 'outline', 'dash'],
            default: 'soft',
          },
          {
            name: 'direction',
            label: 'Direction',
            widget: 'select',
            options: ['horizontal', 'vertical', 'responsive'],
            default: 'horizontal',
          },
          {
            name: 'icon',
            label: 'Icon (Iconify)',
            widget: 'string',
            default: 'lucide:info',
            hint: 'Ví dụ: lucide:info, lucide:alert-triangle, lucide:circle-check',
          },
          {
            name: 'title',
            label: 'Title',
            widget: 'string',
          },
          {
            name: 'body',
            label: 'Content',
            widget: 'text',
          },
        ],
        pattern:
          /^(?:import Alert from '\/src\/components\/Alert\.astro';[ \t]*\r?\n+)?[ \t]*<Alert([^>]*)>([\s\S]*?)<\/Alert>/m,
        fromBlock: (match) => {
          const attributes = match[1] ?? '';
          return {
            type: getAttribute(attributes, 'type') || 'info',
            style: getAttribute(attributes, 'style') || 'soft',
            direction: getAttribute(attributes, 'direction') || 'horizontal',
            icon: getAttribute(attributes, 'icon') || 'lucide:info',
            title: getAttribute(attributes, 'title'),
            body: (match[2] ?? '').trim(),
          };
        },
        toBlock: (props = {}) => {
          const {
            type = 'info',
            style = 'soft',
            direction = 'horizontal',
            icon = 'lucide:info',
            title = '',
            body = '',
          } = props;
          const attributes = [
            `type="${escapeAttribute(type)}"`,
            `style="${escapeAttribute(style)}"`,
            `direction="${escapeAttribute(direction)}"`,
            `icon="${escapeAttribute(icon)}"`,
            `title="${escapeAttribute(title)}"`,
          ].join(' ');
          return `${ALERT_IMPORT}\n\n<Alert ${attributes}>\n${body}\n</Alert>`;
        },
        toPreview: ({ type = 'info', title = '', body = '' } = {}) => {
          const colors = {
            info: '#3b82f6',
            warning: '#f59e0b',
            error: '#ef4444',
            success: '#22c55e',
          };
          return `<div style="border-left:4px solid ${colors[type] ?? '#3b82f6'};padding:12px 16px;margin:12px 0;background:#f8fafc;border-radius:4px">
            <strong style="display:block;margin-bottom:4px">${title}</strong>
            <span>${body}</span>
          </div>`;
        },
      });
    </script>
  </body>
</html>
