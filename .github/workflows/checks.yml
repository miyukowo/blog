name: PR checks

# Credential-free checks for pull requests. This workflow never receives
# deployment secrets (no Cloudflare token/account, no Pages write); those stay
# in the push-only deployment workflows.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Credential-free checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Scoped formatting
        run: bun run format:site:check

      - name: Site compatibility tests
        run: bun run test:site

      - name: Upstream slug tests
        run: bun test src/utils/posts.test.ts

      # Deterministic production-shaped build: full content/OG/RSS/sitemap/
      # Pagefind output, no secrets and no repository-variable dependence.
      - name: Build full static artifact
        env:
          SITE_URL: https://blog.tvphus.dev
          BASE_PATH: ''
          PUBLIC_GISCUS_ENABLED: 'false'
        run: bun run build

      # Validate the directory this workflow built against CURRENT source
      # expectations (no historical snapshot, no self-blessed output); never
      # rebuild here.
      - name: Validate built artifact
        run: node scripts/validate-built-site.mjs --dist dist --mode routine --profile production --site-url https://blog.tvphus.dev
