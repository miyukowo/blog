name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

# WARNING: this workflow holds deployment credentials. It intentionally does
# NOT run on pull_request events, so untrusted PR code never sees the
# Cloudflare token. Keep it that way when editing.
permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    name: Required checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Scoped formatting
        run: bun run format:site:check

      - name: Site compatibility tests
        run: bun run test:site

      - name: Upstream slug tests
        run: bun test src/utils/posts.test.ts

  deploy:
    name: Build & Deploy
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      # Full output validation build: content, OG, RSS, sitemap and Pagefind
      # are all enabled for staging as well as production. The previous
      # staging-only OG skip is removed so previews cannot qualify with
      # missing required output.
      - name: Build full static site
        env:
          SITE_URL: ${{ github.ref_name == 'staging' && 'https://staging-blog.tvphus.dev' || vars.SITE_URL || 'https://blog.tvphus.dev' }}
          BASE_PATH: ''
          PUBLIC_GITHUB_HANDLE: ${{ vars.PUBLIC_GITHUB_HANDLE || 'miyukowo' }}
          PUBLIC_GITHUB_REPO: ${{ vars.PUBLIC_GITHUB_REPO || 'blog' }}
          PUBLIC_TWITTER_HANDLE: ${{ vars.PUBLIC_TWITTER_HANDLE }}
          PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
          # Production comments are a main-only setting. Every non-main
          # build (staging included) receives literal false so preview
          # deployments can never mount the production discussions.
          PUBLIC_GISCUS_ENABLED: ${{ github.ref_name == 'main' && vars.PUBLIC_GISCUS_ENABLED || 'false' }}
          PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO }}
          PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
          PUBLIC_GISCUS_CATEGORY: ${{ vars.PUBLIC_GISCUS_CATEGORY }}
          PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
        run: bun run build

      - name: Generate isolated preview CMS config
        if: github.ref_name != 'main'
        env:
          PREVIEW_SITE_URL: ${{ github.ref_name == 'staging' && 'https://staging-blog.tvphus.dev' || vars.SITE_URL || 'https://blog.tvphus.dev' }}
        run: |
          node scripts/prepare-preview.mjs \
            --dist dist \
            --branch "codex/cms-validation-${{ github.run_id }}" \
            --site-url "${PREVIEW_SITE_URL}"

      - name: Mark preview deployments noindex
        if: github.ref_name != 'main'
        run: node scripts/mark-preview-noindex.mjs --dist dist --branch "${{ github.ref_name }}"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'blog' }} --branch=${{ github.ref_name }}
